name = "uptick-evidence"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[vars]
VAULTS = '{}'
NETWORK = "robinhood-chain"

[[kv_namespaces]]
binding = "TALK"
id = "49cc51a2f53b4ec080a24c415612a4d7"

# Loan health alerts (src/alerts.ts). The namespace is created once by the account owner with `wrangler kv namespace create ALERTS`
# and its id replaces the placeholder below; until then the endpoints answer 503 alerts_unavailable and the scheduled run does nothing.
[[kv_namespaces]]
binding = "ALERTS"
id = "4b386bf58f8245609ae158eaad1d7370"

[triggers]
crons = ["*/10 * * * *"]
