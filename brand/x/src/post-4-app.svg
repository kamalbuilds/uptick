<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
<style>
@font-face { font-family: Archivo; src: url("../fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: Figtree; src: url("../fonts/figtree.woff2") format("woff2"); font-weight: 300 900; }
@font-face { font-family: "Geist Mono"; src: url("../fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
.d { font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 86%; letter-spacing: -0.03em; }
.t { font-family: Figtree, sans-serif; }
.m { font-family: "Geist Mono", monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
</style>
<rect width="1600" height="900" fill="#0e0f0c"/>
<g data-within="60 40 585 870">
<text x="78.0" y="150.0" class="d" font-size="64" fill="#e8ebe6" text-anchor="start" >Deposit NVDA.</text>
<text x="78.0" y="212.0" class="d" font-size="64" fill="#e8ebe6" text-anchor="start" >The band follows</text>
<text x="78.0" y="270.0" class="d" font-size="64" fill="#e8ebe6" text-anchor="start" >the price.</text>
<text x="80.0" y="728.0" class="t" font-size="28" fill="#e8ebe6" text-anchor="start" font-weight="600" >NVDA vault, Robinhood Chain</text>
<text x="80.0" y="764.0" class="t" font-size="28" fill="#e8ebe6" text-anchor="start" font-weight="600" >mainnet fork</text>
<text x="80.0" y="806.0" class="m" font-size="20" fill="#9a9c97" text-anchor="start" >captured from the running app</text>
</g>
<defs><clipPath id="shot"><rect x="609.3" y="46.0" width="910.7" height="770.0" rx="30"/></clipPath></defs>
<image href="app-band-card.png" x="609.3" y="46.0" width="910.7" height="770.0" clip-path="url(#shot)" data-box="screenshot"/>
<text x="1520.0" y="852.0" class="d" font-size="30" fill="#e8ebe6" text-anchor="end" >Uptick</text>
</svg>
