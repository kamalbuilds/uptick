<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
<style>
@font-face { font-family: Archivo; src: url("../fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: Figtree; src: url("../fonts/figtree.woff2") format("woff2"); font-weight: 300 900; }
@font-face { font-family: "Geist Mono"; src: url("../fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
.d { font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 86%; letter-spacing: -0.03em; }
.t { font-family: Figtree, sans-serif; }
.m { font-family: "Geist Mono", monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
</style>
<rect width="1600" height="900" fill="#9fe870"/>
<g data-within="60 40 888 870">
<text x="80.0" y="112.0" class="d" font-size="30" fill="#0e0f0c" text-anchor="start" >Uptick</text>
<text x="78.0" y="258.0" class="d" font-size="72" fill="#0e0f0c" text-anchor="start" >Deposit NVDA.</text>
<text x="78.0" y="334.0" class="d" font-size="72" fill="#0e0f0c" text-anchor="start" >The band follows</text>
<text x="78.0" y="410.0" class="d" font-size="72" fill="#0e0f0c" text-anchor="start" >the price.</text>
<text x="80.0" y="480.0" class="t" font-size="25" fill="#163300" text-anchor="start" >The vault provides liquidity in the NVDA/USDG</text>
<text x="80.0" y="516.0" class="t" font-size="25" fill="#163300" text-anchor="start" >0.05% pool, inside a band 5% around the</text>
<text x="80.0" y="552.0" class="t" font-size="25" fill="#163300" text-anchor="start" >Chainlink price, re-centred at each NYSE open.</text>
<text x="80.0" y="588.0" class="t" font-size="25" fill="#163300" text-anchor="start" >Swap fees accrue while the pool price is inside.</text>
<text x="78.0" y="724.0" class="d" font-size="64" fill="#0e0f0c" text-anchor="start" >$49,968.98</text>
<text x="80.0" y="760.0" class="t" font-size="19" fill="#163300" text-anchor="start" >in the NVDA vault, running on a Robinhood Chain mainnet fork</text>
</g>
<text x="1520.0" y="856.0" class="m" font-size="15" fill="#163300" text-anchor="end" >NVDA vault page, captured from the running app</text>
<defs><clipPath id="shot"><rect x="928.0" y="52.0" width="592.0" height="760.0" rx="16"/></clipPath></defs>
