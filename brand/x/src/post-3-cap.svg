<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
<style>
@font-face { font-family: Archivo; src: url("../fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: Figtree; src: url("../fonts/figtree.woff2") format("woff2"); font-weight: 300 900; }
@font-face { font-family: "Geist Mono"; src: url("../fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
.d { font-family: Archivo, sans-serif; font-weight: 900; font-stretch: 86%; letter-spacing: -0.03em; }
.t { font-family: Figtree, sans-serif; }
.m { font-family: "Geist Mono", monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
</style>
<rect width="1600" height="900" fill="#e8ebe6"/>
<g data-within="60 40 1560 870">
<text x="78.0" y="118.0" class="d" font-size="64" fill="#0e0f0c" text-anchor="start" >Declare a maximum take.</text>
<text x="78.0" y="184.0" class="d" font-size="64" fill="#0e0f0c" text-anchor="start" >Any swap above it reverts.</text>
<text x="80.0" y="236.0" class="t" font-size="22" fill="#454745" text-anchor="start" >Uptick’s cap standard checks the hook’s take inside the swap. One 3% hook, two declared caps, on a fork of Robinhood Chain.</text>
<g data-within="80 276 780 756">
<rect x="80" y="276" width="700" height="480" rx="24" fill="#ffffff"/>
<text x="120.0" y="338.0" class="d" font-size="42" fill="#0e0f0c" text-anchor="start" >200 of 200 revert</text>
<text x="122.0" y="372.0" class="m" font-size="17" fill="#454745" text-anchor="start" >3% hook, declared max 2.50%</text>
<line x1="176" x2="740" y1="700.0" y2="700.0" stroke="#cfd4cb" stroke-width="1"/>
<text x="162.0" y="705.0" class="m" font-size="15" fill="#454745" text-anchor="end" >0%</text>
<line x1="176" x2="740" y1="621.7" y2="621.7" stroke="#cfd4cb" stroke-width="1"/>
<text x="162.0" y="626.7" class="m" font-size="15" fill="#454745" text-anchor="end" >1%</text>
<line x1="176" x2="740" y1="543.4" y2="543.4" stroke="#cfd4cb" stroke-width="1"/>
<text x="162.0" y="548.4" class="m" font-size="15" fill="#454745" text-anchor="end" >2%</text>
<line x1="176" x2="740" y1="465.1" y2="465.1" stroke="#cfd4cb" stroke-width="1"/>
<text x="162.0" y="470.1" class="m" font-size="15" fill="#454745" text-anchor="end" >3%</text>
<rect x="176" y="492.3" width="564" height="12" fill="#0e0f0c"/>
<text x="740.0" y="482.3" class="m" font-size="16" fill="#0e0f0c" text-anchor="end" >max 2.50%</text>
<path d="M376 504.3 L 406 465.1" stroke="#868685" stroke-width="3" stroke-dasharray="4 5" fill="none"/>
<text x="414.0" y="467.1" class="m" font-size="15" fill="#868685" text-anchor="start" >3% wanted</text>
<path d="M200 700.0 Q 316 670.0, 376 504.3" fill="none" stroke="#0e0f0c" stroke-width="5" stroke-linecap="round"/>
<path d="M376 504.3 Q 466 524.3, 546 700.0" fill="none" stroke="#d03238" stroke-width="5" stroke-linecap="round"/>
<circle cx="546" cy="700.0" r="13" fill="#ffffff" stroke="#d03238" stroke-width="4"/>
<text x="572.0" y="638.0" class="m" font-size="17" fill="#d03238" text-anchor="start" >reverts with</text>
<text x="572.0" y="660.0" class="m" font-size="17" fill="#d03238" text-anchor="start" >TakeExceedsCap</text>
<text x="572.0" y="686.0" class="m" font-size="15" fill="#454745" text-anchor="start" >nothing is taken</text>
</g>
<g data-within="820 276 1520 756">
<rect x="820" y="276" width="700" height="480" rx="24" fill="#ffffff"/>
<text x="860.0" y="338.0" class="d" font-size="42" fill="#0e0f0c" text-anchor="start" >200 of 200 settle</text>
<text x="862.0" y="372.0" class="m" font-size="17" fill="#454745" text-anchor="start" >same hook, declared max 3.00%</text>
<line x1="916" x2="1480" y1="700.0" y2="700.0" stroke="#cfd4cb" stroke-width="1"/>
<text x="902.0" y="705.0" class="m" font-size="15" fill="#454745" text-anchor="end" >0%</text>
<line x1="916" x2="1480" y1="621.7" y2="621.7" stroke="#cfd4cb" stroke-width="1"/>
<text x="902.0" y="626.7" class="m" font-size="15" fill="#454745" text-anchor="end" >1%</text>
<line x1="916" x2="1480" y1="543.4" y2="543.4" stroke="#cfd4cb" stroke-width="1"/>
<text x="902.0" y="548.4" class="m" font-size="15" fill="#454745" text-anchor="end" >2%</text>
<line x1="916" x2="1480" y1="465.1" y2="465.1" stroke="#cfd4cb" stroke-width="1"/>
<text x="902.0" y="470.1" class="m" font-size="15" fill="#454745" text-anchor="end" >3%</text>
<rect x="916" y="453.1" width="564" height="12" fill="#0e0f0c"/>
<text x="1480.0" y="443.1" class="m" font-size="16" fill="#0e0f0c" text-anchor="end" >max 3.00%</text>
<path d="M940 700.0 C 1060 700.0, 1076 465.1, 1166 465.1 L 1450 465.1" fill="none" stroke="#0e0f0c" stroke-width="5" stroke-linecap="round"/>
<circle cx="1450" cy="465.1" r="13" fill="#9fe870" stroke="#0e0f0c" stroke-width="4"/>
<text x="1450.0" y="509.1" class="m" font-size="17" fill="#0e0f0c" text-anchor="end" >settles, 3.00% taken</text>
</g>
<text x="80.0" y="806.0" class="t" font-size="22" fill="#0e0f0c" text-anchor="start" >At the edge, under a 3.00% cap: a 3.01% take reverts 60 of 60 times, 2.99% passes 60 of 60.</text>
<text x="80.0" y="852.0" class="m" font-size="16" fill="#454745" text-anchor="start" >CappedTakeHook + CapRegistry · Uniswap v4 PoolManager 0x8366…0951 · about 25k gas per swap</text>
<text x="1520.0" y="852.0" class="d" font-size="30" fill="#0e0f0c" text-anchor="end" >Uptick</text>
</g>
</svg>
